name: Deploy Production

# 三个独立步骤，各自 continue-on-error，互不阻断：
#   1. 部署直播轮询 Worker（写 D1 快照）
#   2. 立即写一行最新快照（让线上旧 /api/live 立刻不再是 7 月的数据）
#   3. 手动发布 Pages（绕过 Cloudflare Git 集成的构建失败）
#
# 依赖 secret：CLOUDFLARE_API_TOKEN（sync-live.yml 自 7 月起就用它成功跑过 d1 execute）
#            CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BILIBILI_UID: '3821157'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run build

      - name: 写入轮询 Worker 配置
        run: |
          cat > workers/live-poller/wrangler.toml <<'EOF'
          name = "lovely-live-poller"
          main = "src/index.ts"
          compatibility_date = "2024-01-01"
          workers_dev = false

          [[d1_databases]]
          binding = "DB"
          database_name = "lovely-site-db"
          database_id = "ed2f83e9-07b8-4d2f-b0e7-788c4cfee4a0"

          [triggers]
          crons = ["* * * * *"]
          EOF

      - name: 部署轮询 Worker
        id: worker
        continue-on-error: true
        run: npx wrangler deploy -c workers/live-poller/wrangler.toml

      - name: 写入最新快照到 D1
        id: snapshot
        continue-on-error: true
        run: node scripts/sync-live-to-d1.js --prod

      - name: 发布 Pages
        id: pages
        continue-on-error: true
        run: npx wrangler pages deploy dist --project-name lovely-site --branch master --commit-dirty=true

      - name: 结果汇总
        if: always()
        run: |
          echo "worker   = ${{ steps.worker.outcome }}"
          echo "snapshot = ${{ steps.snapshot.outcome }}"
          echo "pages    = ${{ steps.pages.outcome }}"
          if [ "${{ steps.worker.outcome }}" != "success" ] && \
             [ "${{ steps.snapshot.outcome }}" != "success" ] && \
             [ "${{ steps.pages.outcome }}" != "success" ]; then
            echo "::error::三项部署全部失败，token 可能已失效或缺权限"
            exit 1
          fi
